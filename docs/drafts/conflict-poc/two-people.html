:root {
  --bg: #0E0C24;
  --panel: #1B1840;
  --panel-2: #141134;
  --ink: #F2EAD3;
  --ink-soft: #A39CC9;
  --edge: #04030F;
  --line: #332E66;
  --you: #B08CFF;
  --alex: #FF6F98;
  --crack: #FF6B5E;
  --ok: #9EF0A0;
  --gold: #F2B01E;
  --crt: #120F2C;
  --crt-ink: #FFE6B0;
  --crt-soft: #9F95C8;
  --f-px: 'Tiny5', 'Courier New', monospace;
  --f-body: 'Atkinson Hyperlegible', system-ui, sans-serif;
  --f-term: 'VT323', ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font: 17px/1.5 var(--f-body);
  background:
    radial-gradient(1px 1px at 12% 18%, #F2EAD3 99%, transparent),
    radial-gradient(1px 1px at 78% 9%, #F2EAD3 99%, transparent),
    radial-gradient(2px 2px at 40% 70%, #B9AED8 99%, transparent),
    radial-gradient(1px 1px at 88% 55%, #F2EAD3 99%, transparent),
    radial-gradient(1px 1px at 22% 88%, #B9AED8 99%, transparent),
    radial-gradient(2px 2px at 63% 33%, #F2EAD3 99%, transparent),
    var(--bg);
  background-attachment: fixed;
}

.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

.top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

h1, h2, h3 {
  font-family: var(--f-px);
  font-weight: 400;
  letter-spacing: 0.04em;
  margin: 0;
}

h1 { font-size: 1.7rem; }

a { color: var(--gold); }

.back { font-size: 0.9rem; }

.who-you { color: var(--you); }
.who-alex { color: var(--alex); }

.term {
  margin: 0;
  padding: 10px 12px;
  background: var(--crt);
  color: var(--crt-ink);
  border: 3px solid var(--edge);
  font: 1.15rem/1.2 var(--f-term);
  white-space: pre;
  overflow-x: auto;
}

.term .prompt { color: var(--gold); }

.box {
  background: var(--panel);
  border: 3px solid var(--edge);
  box-shadow: 5px 5px 0 var(--edge);
}

.tag {
  display: inline-block;
  padding: 0 6px;
  font: 1rem var(--f-term);
  border: 2px solid currentColor;
}

.story {
  margin-top: 18px;
  padding: 12px 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 14px;
  background: var(--panel-2);
  border: 3px solid var(--edge);
  box-shadow: 5px 5px 0 var(--edge);
}

.story-text {
  margin: 0;
  font-size: 1.15rem;
  min-height: 2.9em;
  display: flex;
  align-items: center;
}

.story-count {
  font: 700 0.95rem var(--f-body);
  color: var(--ink-soft);
  white-space: nowrap;
}

.story-buttons { display: flex; gap: 8px; }

button {
  font: 700 0.95rem var(--f-body);
  color: var(--edge);
  background: var(--gold);
  border: 3px solid var(--edge);
  box-shadow: 3px 3px 0 var(--edge);
  padding: 6px 14px;
  cursor: pointer;
}

button.quiet { background: var(--ink-soft); }

button:disabled { opacity: 0.35; cursor: default; }

button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.fade { transition: opacity 0.35s, filter 0.35s, background-color 0.35s, border-color 0.35s, transform 0.35s; }

@media (max-width: 640px) {
  .story { grid-template-columns: 1fr; }
  .story-text { min-height: 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

.graph-wrap { padding: 12px; }
.graph { width: 100%; height: auto; display: block; }
.graph text { font-family: 'VT323', monospace; font-size: 20px; fill: var(--ink); }
.graph .label { stroke: #1B1840; stroke-width: 6px; paint-order: stroke; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 14px; font-weight: 700; }


.crew {
  display: grid;
  grid-template-columns: 1fr 1.5fr 1fr;
  gap: 0 10px;
  align-items: end;
  margin-bottom: 8px;
}

.person { display: flex; flex-direction: column; gap: 2px; font-weight: 700; }
.person code { font: 1rem var(--f-term); color: var(--ink-soft); font-weight: 400; }
.person-alex { text-align: right; align-items: flex-end; }
.file-name { text-align: center; font: 1.2rem var(--f-term); color: var(--ink-soft); }

.rows { display: grid; gap: 6px; }

.row {
  display: grid;
  grid-template-columns: 1fr 1.5fr 1fr;
  gap: 0 10px;
  align-items: center;
  min-height: 40px;
}

.lane { display: flex; align-items: center; min-width: 0; }
.lane-alex { flex-direction: row-reverse; }

.change { display: flex; align-items: center; width: 100%; opacity: 0; transform: translateX(-12px); }
.lane-alex .change { flex-direction: row-reverse; transform: translateX(12px); }
.change.on { opacity: 1; transform: none; }
.change.spent { opacity: 0.3; }

.chip {
  flex: none;
  padding: 2px 8px;
  font: 1.1rem var(--f-term);
  color: var(--edge);
  border: 3px solid var(--edge);
}
.lane-you .chip { background: var(--you); }
.lane-alex .chip { background: var(--alex); }

.bar { flex: 1; height: 4px; min-width: 16px; }
.lane-you .bar { background: var(--you); }
.lane-alex .bar { background: var(--alex); }

.head { width: 0; height: 0; border: 8px solid transparent; }
.lane-you .head { border-left-color: var(--you); border-right-width: 0; }
.lane-alex .head { border-right-color: var(--alex); border-left-width: 0; }

.line {
  position: relative;
  padding: 4px 12px;
  font: 1.3rem/1.2 var(--f-term);
  background: var(--panel);
  border: 3px solid var(--line);
  border-left-width: 8px;
}
.line[data-from="you"] { border-left-color: var(--you); }
.line[data-from="alex"] { border-left-color: var(--alex); }
.line .merged { float: right; font: 0.95rem var(--f-term); color: var(--ok); }
.line.clash {
  border-color: var(--crack);
  background: color-mix(in srgb, var(--crack) 14%, var(--panel));
  box-shadow: 0 0 0 3px var(--edge), 0 0 18px color-mix(in srgb, var(--crack) 60%, transparent);
}
.line .crack { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.line b { font-weight: 400; }

.after {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 18px;
  opacity: 0;
}
.after.on { opacity: 1; }
.tally { padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.tally p { margin: 0; }
.tally .n { font: 1.4rem var(--f-px); margin-right: 6px; }
.ok { color: var(--ok); }
.bad { color: var(--crack); }

@media (max-width: 720px) {
  .crew, .row { grid-template-columns: 1fr 1.6fr 1fr; gap: 0 4px; }
  .chip { font-size: 0.95rem; padding: 1px 4px; }
  .line { font-size: 1.05rem; padding: 4px 6px; }
  .after { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>Two people, one line</h1>
    <a class="back" href="index.html">All prototypes</a>
  </div>
  <div class="crew">
    <div class="person who-you">You<code>main</code></div>
    <div class="file-name">checklist.txt</div>
    <div class="person person-alex who-alex">Alex<code>alex-route</code></div>
  </div>
  <div class="rows" id="rows"></div>
  <div class="after fade" id="after">
    <pre class="term" id="term"></pre>
    <div class="tally box" id="tally"></div>
  </div>
</div>
<script>
const GIT = {
 "alex-short": "2213c54\n",
 "base-short": "17c8683\n",
 "commit-both": "",
 "commit-edit": "",
 "commit-theirs": "",
 "commit-yours": "",
 "diff": "diff --cc checklist.txt\nindex eced626,050f19f..0000000\n--- a/checklist.txt\n+++ b/checklist.txt\n@@@ -1,8 -1,8 +1,12 @@@\n  LAUNCH CHECKLIST\n  1. Seal the hatch\n -2. Fuel tanks: half\n +2. Fuel tanks: full\n  3. Shields: on\n++<<<<<<< HEAD\n +4. Course: the Moon\n++=======\n+ 4. Course: Jupiter\n++>>>>>>> alex-route\n  5. Music: off\n- 6. Snack: crackers\n+ 6. Snack: space noodles\n  7. Wave goodbye to base\n",
 "git-version": "git version 2.43.0\n",
 "head-both": "7f6ec98 4fc8818 2213c54\nMerge branch 'alex-route'\n",
 "head-edit": "ecd523c 4fc8818 2213c54\nMerge branch 'alex-route'\n",
 "head-theirs": "cd5adea 4fc8818 2213c54\nMerge branch 'alex-route'\n",
 "head-yours": "f65b203 4fc8818 2213c54\nMerge branch 'alex-route'\n",
 "log-after-both": "*   7f6ec98 Merge branch 'alex-route'\n|\\  \n| * 2213c54 Head for Jupiter, pack noodles\n* | 4fc8818 Fill the tanks, aim for the Moon\n|/  \n* 17c8683 Write the launch checklist\n",
 "log-after-edit": "*   ecd523c Merge branch 'alex-route'\n|\\  \n| * 2213c54 Head for Jupiter, pack noodles\n* | 4fc8818 Fill the tanks, aim for the Moon\n|/  \n* 17c8683 Write the launch checklist\n",
 "log-after-theirs": "*   cd5adea Merge branch 'alex-route'\n|\\  \n| * 2213c54 Head for Jupiter, pack noodles\n* | 4fc8818 Fill the tanks, aim for the Moon\n|/  \n* 17c8683 Write the launch checklist\n",
 "log-after-yours": "*   f65b203 Merge branch 'alex-route'\n|\\  \n| * 2213c54 Head for Jupiter, pack noodles\n* | 4fc8818 Fill the tanks, aim for the Moon\n|/  \n* 17c8683 Write the launch checklist\n",
 "log-before": "* 4fc8818 Fill the tanks, aim for the Moon\n| * 2213c54 Head for Jupiter, pack noodles\n|/  \n* 17c8683 Write the launch checklist\n",
 "ls-files-u": "100644 ad2a567c163fcac2dccb7d924a485915f95207a4 1\tchecklist.txt\n100644 eced626f7088e13a02f235eef3fcb6e9d4daebb0 2\tchecklist.txt\n100644 050f19fcd2f5c6a50d009e59208aabbccc89c8e2 3\tchecklist.txt\n",
 "main-short": "4fc8818\n",
 "markers": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: full\n3. Shields: on\n<<<<<<< HEAD\n4. Course: the Moon\n=======\n4. Course: Jupiter\n>>>>>>> alex-route\n5. Music: off\n6. Snack: space noodles\n7. Wave goodbye to base\n",
 "merge-exit": "1\n",
 "merge": "Auto-merging checklist.txt\nCONFLICT (content): Merge conflict in checklist.txt\nAutomatic merge failed; fix conflicts and then commit the result.\n",
 "resolved-both": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: full\n3. Shields: on\n4. Course: the Moon\n4. Course: Jupiter\n5. Music: off\n6. Snack: space noodles\n7. Wave goodbye to base\n",
 "resolved-edit": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: full\n3. Shields: on\n4. Course: the Moon, then Jupiter\n5. Music: off\n6. Snack: space noodles\n7. Wave goodbye to base\n",
 "resolved-theirs": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: full\n3. Shields: on\n4. Course: Jupiter\n5. Music: off\n6. Snack: space noodles\n7. Wave goodbye to base\n",
 "resolved-yours": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: full\n3. Shields: on\n4. Course: the Moon\n5. Music: off\n6. Snack: space noodles\n7. Wave goodbye to base\n",
 "restore-ours": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: full\n3. Shields: on\n4. Course: the Moon\n5. Music: off\n6. Snack: crackers\n7. Wave goodbye to base\n",
 "restore-theirs": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: half\n3. Shields: on\n4. Course: Jupiter\n5. Music: off\n6. Snack: space noodles\n7. Wave goodbye to base\n",
 "stage1-base": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: half\n3. Shields: on\n4. Course: Mars\n5. Music: off\n6. Snack: crackers\n7. Wave goodbye to base\n",
 "stage2-ours": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: full\n3. Shields: on\n4. Course: the Moon\n5. Music: off\n6. Snack: crackers\n7. Wave goodbye to base\n",
 "stage3-theirs": "LAUNCH CHECKLIST\n1. Seal the hatch\n2. Fuel tanks: half\n3. Shields: on\n4. Course: Jupiter\n5. Music: off\n6. Snack: space noodles\n7. Wave goodbye to base\n",
 "status-added-both": "On branch main\nAll conflicts fixed but you are still merging.\n  (use \"git commit\" to conclude merge)\n\nChanges to be committed:\n\tmodified:   checklist.txt\n\n",
 "status-added-edit": "On branch main\nAll conflicts fixed but you are still merging.\n  (use \"git commit\" to conclude merge)\n\nChanges to be committed:\n\tmodified:   checklist.txt\n\n",
 "status-added-theirs": "On branch main\nAll conflicts fixed but you are still merging.\n  (use \"git commit\" to conclude merge)\n\nChanges to be committed:\n\tmodified:   checklist.txt\n\n",
 "status-added-yours": "On branch main\nAll conflicts fixed but you are still merging.\n  (use \"git commit\" to conclude merge)\n\nChanges to be committed:\n\tmodified:   checklist.txt\n\n",
 "status": "On branch main\nYou have unmerged paths.\n  (fix conflicts and run \"git commit\")\n  (use \"git merge --abort\" to abort the merge)\n\nUnmerged paths:\n  (use \"git add <file>...\" to mark resolution)\n\tboth modified:   checklist.txt\n\nno changes added to commit (use \"git add\" and/or \"git commit -a\")\n"
};
const lines = (text) => text.replace(/\n$/, "").split("\n");

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === false || value === null || value === undefined) continue;
    if (key === "text") node.textContent = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  node.append(...children.flat().filter((child) => child !== null && child !== undefined && child !== false));
  return node;
}

/* The step-through: one sentence per step, Back and Next, arrow keys, and #n in the address so
   a screenshot can open any step. render(index) redraws the stage for that step. canLeave(index)
   may hold Next back until the player has done something. */
function stepper(sentences, render, canLeave = () => true) {
  const text = el("p", { class: "story-text", "aria-live": "polite" });
  const count = el("span", { class: "story-count" });
  const back = el("button", { class: "quiet", type: "button", text: "Back" });
  const next = el("button", { type: "button", text: "Next" });
  const bar = el("nav", { class: "story", "aria-label": "Story steps" }, count, text, el("div", { class: "story-buttons" }, back, next));
  document.querySelector(".page").append(bar);

  /* A step from the address, but never past a step that still holds Next back. */
  const fromHash = () => {
    const wanted = Math.min(Math.max(parseInt(location.hash.slice(1), 10) - 1 || 0, 0), sentences.length - 1);
    let reached = 0;
    while (reached < wanted && canLeave(reached)) reached += 1;
    return reached;
  };
  let index = fromHash();
  const show = () => {
    count.textContent = `${index + 1} / ${sentences.length}`;
    text.textContent = sentences[index];
    back.disabled = index === 0;
    next.disabled = index === sentences.length - 1 || !canLeave(index);
    history.replaceState(null, "", `#${index + 1}`);
    render(index);
  };
  const go = (delta) => {
    const target = index + delta;
    if (target < 0 || target >= sentences.length || (delta > 0 && !canLeave(index))) return;
    index = target;
    show();
  };
  back.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));
  document.addEventListener("keydown", (event) => {
    if (event.target.closest("input, textarea")) return;
    if (event.key === "ArrowRight") go(1);
    if (event.key === "ArrowLeft") go(-1);
  });
  window.addEventListener("hashchange", () => {
    index = fromHash();
    show();
  });
  show();
  return { refresh: show };
}

/* Where a line of a resolved file came from: "you" or "alex" for a change Git merged on its own,
   "chosen" for a line from the conflict block, null for a line nobody changed. */
function lineOrigin(text, { base, ours, theirs, clashAt }) {
  if (base.includes(text)) return null;
  if (ours.includes(text) && !theirs.includes(text) && text !== ours[clashAt]) return "you";
  if (theirs.includes(text) && !ours.includes(text) && text !== theirs[clashAt]) return "alex";
  return "chosen";
}

function capsule(x, y, fill, hash, split) {
  const w = 86, h = 34;
  const parts = [`<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" fill="${fill}" stroke="#04030F" stroke-width="3"/>`];
  if (split) parts.push(`<rect x="${x}" y="${y - h / 2 + 1.5}" width="${w / 2 - 1.5}" height="${h - 3}" fill="${split}"/>`,
    `<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" fill="none" stroke="#04030F" stroke-width="3"/>`);
  parts.push(`<text x="${x}" y="${y + 6}" text-anchor="middle" style="fill:#04030F">${hash}</text>`);
  return parts.join("");
}

/* The merge as a diamond: where you both started, one capsule each, and the merge commit on top
   with one parent line in each person's colour. head is `git log -1 --format='%h %p'` output. */
function mergeDiamond({ baseHash, yourHash, alexHash, head }) {
  const merge = head.split("\n")[0].split(" ");
  const wrap = el("div", { class: "box graph-wrap" });
  wrap.innerHTML = `<svg class="graph" viewBox="0 0 400 290" role="img" aria-label="Merge commit ${merge[0]} with parents ${merge[1]} and ${merge[2]}">
    <path d="M200 250 L75 170 M200 250 L325 170" stroke="#A39CC9" stroke-width="4" fill="none"/>
    <path d="M75 170 L200 60" stroke="#B08CFF" stroke-width="5"/>
    <path d="M325 170 L200 60" stroke="#FF6F98" stroke-width="5"/>
    ${capsule(200, 250, "#A39CC9", baseHash)}
    ${capsule(75, 170, "#B08CFF", yourHash)}
    ${capsule(325, 170, "#FF6F98", alexHash)}
    ${capsule(200, 60, "#B08CFF", merge[0], "#FF6F98")}
    <text class="label" x="200" y="22" text-anchor="middle" style="fill:#F2B01E">main: the merge commit</text>
    <text class="label" x="75" y="210" text-anchor="middle" style="fill:#B08CFF">parent 1: yours</text>
    <text class="label" x="325" y="210" text-anchor="middle" style="fill:#FF6F98">parent 2: Alex's</text>
    <text class="label" x="200" y="284" text-anchor="middle" style="fill:#A39CC9">where you both started</text>
  </svg>`;
  return wrap;
}


const base = lines(GIT["stage1-base"]);
const ours = lines(GIT["stage2-ours"]);
const theirs = lines(GIT["stage3-theirs"]);

const rows = base.map((text, i) => ({
  base: text,
  you: ours[i] !== text ? ours[i] : null,
  alex: theirs[i] !== text ? theirs[i] : null,
}));

const short = (line) => line.replace(/^\d+\.\s*/, "").replace(/^[^:]*:\s*/, "");

const crackSvg = () => {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "crack");
  svg.setAttribute("viewBox", "0 0 100 20");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.innerHTML = '<polyline points="90,0 95,6 90,10 96,14 91,20" fill="none" stroke="#FF6B5E" stroke-width="1.6" vector-effect="non-scaling-stroke" style="stroke-width:3px"/>';
  return svg;
};

function render(step) {
  const host = document.getElementById("rows");
  host.replaceChildren(...rows.map((row) => {
    const clash = row.you && row.alex;
    const youOn = row.you && step >= 1;
    const alexOn = row.alex && step >= 2;
    const merged = !clash && step >= 3 && (row.you || row.alex);
    const spent = step >= 3 && !clash;

    const line = el("div", { class: "line fade" });
    if (clash && step >= 4) {
      line.classList.add("clash");
      const label = row.base.slice(0, row.base.length - short(row.base).length);
      line.append(label, el("b", { class: "who-you", text: short(row.you) }), " or ", el("b", { class: "who-alex", text: short(row.alex) }), "?", crackSvg());
    } else if (merged) {
      line.dataset.from = row.you ? "you" : "alex";
      line.append(row.you || row.alex, el("span", { class: "merged", text: "merged" }));
    } else {
      line.append(row.base);
    }

    const change = (who, text, on) => el("div", { class: `change fade${on ? " on" : ""}${on && spent ? " spent" : ""}` },
      el("span", { class: "chip", text: short(text || "") }), el("span", { class: "bar" }), el("span", { class: "head" }));

    return el("div", { class: "row" },
      el("div", { class: "lane lane-you" }, row.you ? change("you", row.you, youOn) : null),
      line,
      el("div", { class: "lane lane-alex" }, row.alex ? change("alex", row.alex, alexOn) : null));
  }));

  const after = document.getElementById("after");
  after.classList.toggle("on", step >= 4);
  document.getElementById("term").textContent = "$ git merge alex-route\n" + GIT.merge;
  const cleanCount = rows.filter((row) => !(row.you && row.alex) && (row.you || row.alex)).length;
  const clashCount = rows.filter((row) => row.you && row.alex).length;
  document.getElementById("tally").replaceChildren(...[
    el("p", {}, el("span", { class: "n ok", text: String(cleanCount) }), "lines changed by one person: merged on their own"),
    el("p", {}, el("span", { class: "n bad", text: String(clashCount) }), "line changed by both of you: waits for you"),
    step >= 5 ? el("p", { class: "ok" }, "Fix that one line, then git add and git commit.") : null,
  ].filter(Boolean));
}

stepper([
  "This is the launch checklist you and Alex both started from.",
  "You changed two lines on your branch: the fuel and the course.",
  "Alex changed two lines on another branch: the course and the snack.",
  "When you merge, Git takes every change that only one of you made. Fuel and snack are done.",
  "But you both changed the course line, in different ways. Git won't guess, so it stops the merge.",
  "Only that one line waits for you. Everything else is already merged.",
], render);
</script>
