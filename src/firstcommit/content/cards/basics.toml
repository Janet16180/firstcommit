notes = """
Git keeps a project's history in a repository: the hidden `.git` folder that `git init` creates
in the project folder. A version you save is a commit. In the game, a new repository's first
branch is called `main`.

Git works with three areas:

- the working folder (Git says working tree): the files you see and edit;
- the staging area (Git says index): what the next commit will contain;
- the repository: the commits, each a snapshot of the project's files with an author, a date, a message and its parent (the first commit has none).

A new file is untracked until you stage it. `git add` copies a file's current content into the
staging area; edit the file again, and you add it again to stage the new content. A plain
`git commit` saves the staging area as a new commit, and afterwards the staging area still
matches that commit. `git status` lists the files that are untracked, staged, or changed but not
staged, so run it often.

Git records your name and email as the author of your commits. Set them once with the two
`git config --global` commands below; inside one repository, the same commands without
`--global` override them.

    $ git init                           # make the current folder a repository
    $ git status                         # the branch, and untracked, staged and changed files
    $ git add README.md                  # copy a file's current content into the staging area
    $ git commit -m "Add the README"     # save the staging area as a new commit
    $ git log --oneline                  # one line per commit, newest first
    $ git config --global user.name "Your Name"
    $ git config --global user.email you@example.com
"""

[[card]]
id = "basics-repository-folder"
kind = "choice"
level = 1
prompt = "After `git init` in a folder, where does Git keep the project's history?"
correct = "In a hidden `.git` folder inside that folder"
wrong = [
    "In a hidden folder in your home folder",
    "On GitHub, once you create the project there",
    "Inside each file, as hidden extra data",
]
explain = """
`git init` creates a `.git` folder in the current folder: that is the repository, with the
project's commits, branches and settings. Its name starts with a dot, so a plain `ls` leaves it
out; `ls -A` shows it. Your home folder holds your personal Git settings, not a project's history.
GitHub is a hosting service: a repository works on your computer without it. And Git does not
store history inside your files; the history lives in `.git`.
"""
source = "git-init(1), DESCRIPTION; Pro Git 2nd ed., 1.3 (the Git directory)"
verify = """
git init -q demo
test -d demo/.git/objects && test -d demo/.git/refs && test "$(ls demo)" = ""
"""

[[card]]
id = "basics-commit-needs-staging"
kind = "choice"
level = 1
prompt = "In a new repository, you create `notes.txt` and run `git commit -m \"Add notes\"` straight away. What happens?"
correct = "No commit is made: nothing is staged yet"
wrong = [
    "Git commits `notes.txt`, since it is in the folder",
    "Git stages `notes.txt` on its own, then commits it",
    "Git makes a commit with the message and no files",
]
explain = """
A plain `git commit` takes the content of the staging area, and a new file gets there with
`git add`. With nothing staged, `git commit` stops without making a commit. Being in the working
folder is not enough: a new file goes into a commit only after `git add`. Git does not stage new
files on its own, and it does not record a commit without files here either.
"""
source = "git-commit(1), DESCRIPTION; git-add(1), DESCRIPTION"
verify = """
git init -q
echo "my notes" > notes.txt
if git commit -q -m "Add notes" >/dev/null 2>&1; then exit 1; fi
! git rev-parse -q --verify HEAD >/dev/null
"""

[[card]]
id = "basics-add-copies"
kind = "choice"
level = 1
prompt = "What does `git add README.md` do?"
correct = "Copies the file's current content into the staging area"
wrong = [
    "Saves the file in a new commit",
    "Moves the file from the working folder into the repository",
    "Tells Git to stage every later edit of the file by itself",
]
explain = """
`git add` copies the content the file has at that moment into the staging area, the list of
what the next commit will contain. `git add` itself commits nothing: `git commit` does. The file
stays in the working folder: `git add` copies, it does not move. And it is a one-time copy: after
another edit, you run `git add` again to stage the new content.
"""
source = "git-add(1), DESCRIPTION"
verify = """
git init -q
echo one > README.md
git add README.md
echo two > README.md
test -f README.md && test "$(git show :README.md)" = one && ! git rev-parse -q --verify HEAD >/dev/null
"""

[[card]]
id = "basics-identity"
kind = "choice"
level = 1
prompt = "Why do you set `user.name` and `user.email` before your first commit?"
correct = "Git records them as the author of your commits"
wrong = [
    "GitHub uses them to log you in when you push",
    "Git refuses to run any command until they are set",
    "They make you the owner of the repository's files",
]
explain = """
Every commit records an author, a name and an email, which Git normally takes from
`user.name` and `user.email`. They are plain text in the commit and are not a login: signing in
to GitHub is a separate matter. Most commands, such as `git init`, `git add` and `git status`,
work without them. They grant no ownership or permissions on files either. Set them once per
computer with `git config --global user.name "Your Name"` and
`git config --global user.email you@example.com`; inside one repository, the same commands
without `--global` override them.
"""
source = "git-commit(1), COMMIT INFORMATION; git-config(1), FILES; Pro Git 2nd ed., 1.6 (Your Identity)"
verify = """
git init -q
git config user.name "Robin Park"
git config user.email robin@example.com
echo hi > a.txt
git add a.txt
env -u GIT_AUTHOR_NAME -u GIT_AUTHOR_EMAIL -u GIT_COMMITTER_NAME -u GIT_COMMITTER_EMAIL git commit -q -m First
test "$(git log -1 --format='%an <%ae>')" = "Robin Park <robin@example.com>"
"""

[[card]]
id = "basics-init-command"
kind = "text"
level = 1
prompt = "Which command turns the current folder into a new, empty Git repository?"
accept = ["git init", "git init .", "git init -b main", "git init --initial-branch=main"]
explain = """
`git init` creates the `.git` folder that holds the repository, with no commits yet. In the
game its first branch is called `main`, because the game sets Git's `init.defaultBranch`
setting. `git init -b main` names it `main` whatever the settings say.
"""
source = "git-init(1), DESCRIPTION and --initial-branch"
verify = """
git init -q one
GIT_CONFIG_GLOBAL=/dev/null git init -q -b main two
test "$(git config --global init.defaultBranch)" = main &&
  test "$(git -C one symbolic-ref HEAD)" = refs/heads/main &&
  test "$(git -C two symbolic-ref HEAD)" = refs/heads/main
"""

[[card]]
id = "basics-log-oneline"
kind = "text"
level = 1
prompt = "Which option makes `git log` show each commit on one line, starting with a short hash?"
accept = ["--oneline", "git log --oneline"]
explain = """
`--oneline` is shorthand for `--pretty=oneline --abbrev-commit`. Each commit gets one line: its
hash shortened to a prefix that is unique in the repository, then its message's title (the text
up to the first blank line, usually one line). Commits are listed newest first. On a terminal,
names such as `(HEAD -> main)` appear between the hash and the title of the commit they point to.
"""
source = "git-log(1), --oneline, --abbrev-commit and Commit Ordering"
verify = """
git init -q
echo one > a.txt && git add a.txt && git commit -q -m "First"
echo two > a.txt && git add a.txt && git commit -q -m "Second"
test "$(git log --oneline)" = "$(git log --pretty=oneline --abbrev-commit)" &&
  test "$(git log --oneline --no-decorate | cut -d' ' -f2-)" = "$(printf 'Second\\nFirst')"
"""

[[card]]
id = "basics-staged-not-committed"
kind = "predict"
level = 1
prompt = "What does the last command print? (`wc -l` counts the lines it receives.)"
code = """
git init -q
echo one > a.txt
git add a.txt
git commit -q -m "First"
echo two > a.txt
git add a.txt
git log --oneline | wc -l
"""
correct = "1"
wrong = ["2", "0"]
explain = """
`git log --oneline` prints one line per commit, and there is only one commit. The second change
was staged with `git add` but never committed: staging prepares the next commit, and it takes
`git commit` to add it to the history. The answer is not 0 either: the first commit was made.
"""
source = "git-log(1), DESCRIPTION; git-commit(1), DESCRIPTION"

[[card]]
id = "basics-commit-records"
kind = "choice"
level = 2
prompt = "What does a commit record?"
correct = "A snapshot of the project's files, with author, date and message"
wrong = [
    "Only the lines that changed since the previous commit",
    "The commands you ran since the previous commit",
    "A copy of the whole working folder, untracked files too",
]
explain = """
A plain `git commit` stores the content of every file in the staging area, plus who made it,
when, the message and its parent commit. Git thinks in snapshots, not in lists of changed lines:
when `git show` displays a commit's changes, it computes them by comparing the commit with its
parent. Git records files, not the commands you typed. Untracked files stay out of the commit.
"""
source = "git-commit(1), DESCRIPTION; git-show(1), DESCRIPTION; Pro Git 2nd ed., 1.3 (Snapshots, Not Differences)"
verify = """
git init -q
echo a > a.txt && echo b > b.txt
git add a.txt b.txt && git commit -q -m "One"
echo more >> a.txt && echo c > c.txt
git add a.txt && git commit -q -m "Two"
test "$(git ls-tree --name-only HEAD | tr '\\n' ' ')" = "a.txt b.txt "
"""

[[card]]
id = "basics-why-staging"
kind = "choice"
level = 2
prompt = "Why does Git have a staging area between the working folder and the commits?"
correct = "So you choose exactly what goes into the next commit"
wrong = [
    "So that Git keeps a backup if a commit goes wrong",
    "Because Git cannot read files straight from the folder",
    "To hold files until they are sent to a server",
]
explain = """
The staging area is where you build the next commit. You stage the changes that belong together
and leave the rest for a later commit, so each commit has one purpose and a message that fits.
It is not a backup: your history is in the commits. Git reads the working folder whenever it
needs to; `git add` copies from it. Sending work to a server (pushing) sends commits that are
already made, and has nothing to do with staging.
"""
source = "git-add(1), DESCRIPTION; Pro Git 2nd ed., 1.3 (The basic Git workflow)"
verify = """
git init -q
echo a > a.txt && echo b > b.txt
git add a.txt && git commit -q -m "Add a"
git add b.txt && git commit -q -m "Add b"
test "$(git show --name-only --format= HEAD~1)" = a.txt && test "$(git show --name-only --format= HEAD)" = b.txt
"""

[[card]]
id = "basics-staged-version"
kind = "choice"
level = 2
prompt = "You run `git add note.txt`, edit `note.txt` again, then run `git commit -m \"Add the note\"`. What does the commit hold?"
correct = "`note.txt` as it was when you ran `git add`"
wrong = [
    "`note.txt` as it is when you run `git commit`",
    "Both versions of `note.txt`, one after the other",
    "Nothing: the commit fails because the file changed",
]
explain = """
`git add` copies the file's content at that moment into the staging area, and the commit takes
the staging area as it is. Your later edit stays in the working folder, not committed:
`git status` shows it as a change that is not staged. A commit holds one version of each file,
and an edit after `git add` does not make the commit fail.
"""
source = "git-add(1), DESCRIPTION; Pro Git 2nd ed., 2.2 (Staging Modified Files)"
verify = """
git init -q
echo one > note.txt
git add note.txt
echo two > note.txt
git commit -q -m "Add the note"
test "$(git show HEAD:note.txt)" = one && test "$(cat note.txt)" = two
"""

[[card]]
id = "basics-index-after-commit"
kind = "choice"
level = 2
prompt = "Right after `git commit`, what is in the staging area?"
correct = "The same content as the new commit"
wrong = [
    "Nothing: committing emptied it",
    "Only the files that changed in that last commit",
    "The changes that you left out of the commit",
]
explain = """
The staging area is not a queue that a commit empties: it is the full list of files for the next
commit, and a plain `git commit` records it as it is. Right after a plain `git commit`, the
staging area and the commit hold the same content, which is why `git status` has nothing staged
to report. `git ls-files` lists the staging area, and still lists every tracked file. Changes you
did not stage stay in the working folder, not in the staging area.
"""
source = "gitglossary(7), index; git-add(1), DESCRIPTION; git-ls-files(1)"
verify = """
git init -q
echo a > a.txt && echo b > b.txt
git add a.txt b.txt && git commit -q -m "One"
echo more >> a.txt && git add a.txt && git commit -q -m "Two"
test "$(git ls-files | tr '\\n' ' ')" = "a.txt b.txt " && git diff --cached --quiet
"""

[[card]]
id = "basics-commit-all-skips-new"
kind = "predict"
level = 3
prompt = "What does the last command print? (`git ls-files` lists the staging area, and `wc -l` counts lines.)"
code = """
git init -q
echo one > a.txt
git add a.txt
git commit -q -m "First"
echo two >> a.txt
echo new > b.txt
git commit -q -a -m "Second"
git ls-files | wc -l
"""
correct = "1"
wrong = ["2", "0"]
explain = """
`git commit -a` stages the changes to files Git already tracks, then commits. `a.txt` is
tracked, so its edit goes into the second commit. `b.txt` is new: `-a` leaves it untracked, so
the staging area still lists only `a.txt`. The answer is not 0: committing does not clear the
staging area, so `a.txt` is still listed.
"""
source = "git-commit(1), -a; Pro Git 2nd ed., 2.2 (Skipping the Staging Area)"
