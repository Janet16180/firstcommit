notes = """
Los cambios sin commit no pertenecen a ningún branch: `git switch -c` crea un branch, va a él y
se los lleva.

Un `git push` simple envía solo el branch donde estás, a su upstream; un branch nuevo sube por su
nombre, y `-u` convierte la copia del remoto en su upstream.

    $ git switch -c fix-lights                    # crea un branch y ve a él, con tus cambios
    $ git push -u origin scout                    # envía un branch por su nombre y lo sigue
    $ git branch -a                               # tus branches y los del remoto
"""

[[card]]
id = "branch-push-one"
prompt = "Estás en `main`, que tiene upstream, y tienes un branch `scout` que el remoto nunca vio. Ejecutas un `git push` simple. ¿Qué llega al remoto?"
correct = "Solo `main`"
wrong = [
    "`main` y `scout`, porque los dos son tuyos",
    "Solo `scout`, porque es nuevo",
    "Cada branch que tiene un commit que le falta al remoto",
]
explain = """
Con la configuración por defecto de git, un `git push` simple envía solo el branch donde estás, a
su upstream. `scout` se queda aquí hasta que lo nombras: `git push -u origin scout`, que funciona
desde cualquier branch. `git push --all` enviaría todos los branches.
"""

[[card]]
id = "branch-switch-c-carries"
prompt = "Editaste `lights.cfg` en `main` y no hiciste commit. Ejecutas `git switch -c fix-lights`. ¿Dónde está tu cambio?"
correct = "En la carpeta de trabajo, en `fix-lights`, todavía sin commit"
wrong = [
    "Se quedó en `main`; `fix-lights` empieza sin él",
    "Con un commit en `main` antes del switch",
    "Se perdió: git descarta los cambios al crear un branch",
]
explain = """
Los cambios sin commit no pertenecen a ningún branch: están en la carpeta de trabajo y en el
staging area. `git switch -c` crea el branch sobre el commit donde estás, así que nada en la
carpeta tiene que cambiar, y el cambio va contigo. Haz commit allí, y `main` nunca lo ve.
"""

[[card]]
id = "branch-switch-refused"
prompt = "En `scout` cambiaste `route.txt`, que es distinto en `main`, y no hiciste commit. Ejecutas `git switch main`. ¿Qué pasa?"
correct = "Git se niega, y tu cambio se queda"
wrong = [
    "Git cambia de branch y descarta tu cambio",
    "Git hace commit de tu cambio en `scout` primero",
    "Git cambia de branch y junta las dos versiones",
]
explain = """
Un cambio sin commit no pertenece a ningún branch, así que un cambio de branch lo lleva consigo
cuando puede. Aquí `main` tiene otra versión del archivo, y cambiar de branch sobrescribiría tu
cambio, así que Git se niega y no cambia nada. Haz commit del cambio donde corresponde, o descártalo
con `git restore route.txt`, y después cambia de branch.
"""
