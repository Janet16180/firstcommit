notes = """
A clone copies a whole repository: every commit of its history, a remote named `origin` for its
address, and a branch of your own, such as `main`, on the commit the remote's branch was on.

A branch is a label on a commit. `git branch scout` writes a new label on the commit you are on
and copies no file. `HEAD` says which branch you are on; `git switch scout` moves it there and
rewrites the working folder to match that branch's last commit. Your next commit moves only the
branch you are on. Changes you have not committed belong to no branch: `git switch -c` takes them
along onto the new branch.

`origin/main` is your repository's record of the remote's `main`, as of the last time it heard
from it. A plain `git push` sends only the branch you are on, to its upstream; a new branch goes
up by name, and `-u` makes the remote's copy its upstream.

    $ git clone github.com/moonbase/project.git   # copy a repository and its whole history
    $ git branch scout                            # a new label on the commit you are on
    $ git switch scout                            # move onto it; the working folder follows
    $ git switch -c fix-lights                    # make a branch and move onto it, edits and all
    $ git push -u origin scout                    # send a branch by name, and track it
    $ git branch -a                               # your branches, and the remote's
"""

[[card]]
id = "branch-clone-history"
kind = "choice"
level = 1
prompt = "You clone a repository whose `main` has 40 commits. How much of that history is in your clone?"
correct = "All 40 commits"
wrong = [
    "Only the last commit, with its files",
    "The files of the last commit, with no history",
    "The last ten commits",
]
explain = """
`git clone` copies the whole history: every commit the remote's branches reach, with its author,
date and message. That is why you can read `git log` in a clone at once, without asking the
remote. A clone made with `--depth` is shallow and holds less, but a plain `git clone` holds it
all.
"""
source = "git-clone(1), DESCRIPTION and `--depth`"
verify = """
git init -q base && cd base
for n in 1 2 3 4 5; do echo "line $n" >> log.txt && git add log.txt && git commit -q -m "Entry $n"; done
cd .. && git clone -q base copy
test "$(git -C copy rev-list --count main)" = 5
"""

[[card]]
id = "branch-is-a-label"
kind = "choice"
level = 1
prompt = "You are on `main` and run `git branch scout`. What changes?"
correct = "A new label, `scout`, now points at your commit"
wrong = [
    "The working folder is copied into a new folder for `scout`",
    "You are now on `scout`, ready to commit there",
    "A branch `scout` is created on the remote too",
]
explain = """
`git branch scout` writes one new label on the commit you are on. No file is copied, you stay on
`main` (`git switch scout` moves you), and nothing reaches the remote until you push the branch.
"""
source = "git-branch(1), DESCRIPTION"
verify = """
git init -q base && cd base
echo "Route: Earth, Moon" > route.txt && git add route.txt && git commit -q -m "Add the route"
git branch scout
test "$(git rev-parse scout)" = "$(git rev-parse main)" && test "$(git branch --show-current)" = main && test "$(ls)" = route.txt
"""

[[card]]
id = "branch-switch-folder"
kind = "predict"
level = 2
prompt = "What does the last command print?"
code = """
git init -q base && cd base
echo "Route: Earth, Moon" > route.txt && git add route.txt && git commit -q -m "Add the route"
git switch -q -c scout
echo "Probe: launched" > probe.txt && git add probe.txt && git commit -q -m "Launch the probe"
git switch -q main
ls
"""
correct = "route.txt"
wrong = ["probe.txt route.txt", "probe.txt"]
explain = """
`git switch main` rewrites the working folder to match `main`'s last commit, which has no
`probe.txt`, so the file leaves the folder. It is not lost: it lives in `scout`'s commit, and
`git switch scout` brings it back.
"""
source = "git-switch(1), DESCRIPTION"

[[card]]
id = "branch-push-one"
kind = "choice"
level = 2
prompt = "You are on `main`, which has an upstream, and you have a branch `scout` the remote has never seen. You run a plain `git push`. What reaches the remote?"
correct = "Only `main`"
wrong = [
    "`main` and `scout`, since both are yours",
    "`scout` only, since it is new",
    "Every branch that has a commit the remote lacks",
]
explain = """
With git's default settings, a plain `git push` sends only the branch you are on, to its
upstream. `scout` stays here until you name it: `git push -u origin scout`, which works from any
branch. `git push --all` would send every branch.
"""
source = "git-push(1), DESCRIPTION; git-config(1), `push.default` (default `simple`)"
verify = """
git init -q --bare remote.git
git init -q base && cd base
echo "Route: Earth, Moon" > route.txt && git add route.txt && git commit -q -m "Add the route"
git remote add origin ../remote.git && git push -q -u origin main
git switch -q -c scout && echo "Crater A: ice" > survey.txt && git add survey.txt && git commit -q -m "Survey" && git switch -q main
git push -q
! git -C ../remote.git rev-parse -q --verify refs/heads/scout
"""

[[card]]
id = "branch-origin-main"
kind = "text"
level = 1
prompt = "In your clone, what is the name of your repository's record of where the remote `origin`'s `main` was when you last heard from it?"
accept = ["origin/main", "remotes/origin/main", "refs/remotes/origin/main"]
explain = """
`origin/main` is a remote-tracking branch: a label your repository moves when it hears from
`origin` (clone, fetch, pull, push). `git branch -a` lists it as `remotes/origin/main`. It is not
the remote itself, only the last news of it.
"""
source = "gitglossary(7), remote-tracking branch; git-branch(1), `-a`"

[[card]]
id = "branch-switch-c-carries"
kind = "choice"
level = 3
prompt = "You edited `lights.cfg` on `main` and have not committed. You run `git switch -c fix-lights`. Where is your edit?"
correct = "In the working folder, on `fix-lights`, still uncommitted"
wrong = [
    "Left on `main`; `fix-lights` starts without it",
    "Committed on `main` before the switch",
    "Gone: git discards changes when it makes a branch",
]
explain = """
Changes you have not committed belong to no branch: they are in the working folder and the
staging area. `git switch -c` makes the branch on the commit you are on, so nothing in the folder
has to change, and the edit comes along. Commit it there, and `main` never sees it.
"""
source = "git-switch(1), `-c`; DESCRIPTION (local modifications)"
verify = """
git init -q base && cd base
printf 'deck=dim\\nhall=off\\n' > lights.cfg && git add lights.cfg && git commit -q -m "Add the lights"
printf 'deck=dim\\nhall=on\\n' > lights.cfg
git switch -q -c fix-lights
test "$(git branch --show-current)" = fix-lights && test "$(git status --porcelain)" = " M lights.cfg"
"""

[[card]]
id = "branch-switch-refused"
kind = "choice"
level = 3
prompt = "On `scout` you edited `route.txt`, which is different on `main`, and did not commit. You run `git switch main`. What happens?"
correct = "Git refuses, and your edit stays"
wrong = [
    "Git switches and drops your edit",
    "Git commits your edit on `scout` first",
    "Git switches and merges the two versions",
]
explain = """
An edit you have not committed belongs to no branch, so a switch carries it along when it can.
Here `main` has another version of the file, and switching would overwrite your edit, so Git
refuses and changes nothing. Commit the edit where it belongs, or throw it away with
`git restore route.txt`, then switch.
"""
source = "git-switch(1), DESCRIPTION"
verify = """
git init -q base && cd base
echo "Earth" > route.txt && git add route.txt && git commit -q -m "Route"
git switch -q -c scout && echo "Mars" >> route.txt && git commit -q -am "Mars" && echo "Phobos" >> route.txt
! git switch main 2> /dev/null
test "$(git branch --show-current)" = scout && grep -q Phobos route.txt
"""
